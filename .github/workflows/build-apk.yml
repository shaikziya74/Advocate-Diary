name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Create Android project and copy app code
        run: |
          flutter create --platforms=android --org com.ziya --project-name advocate_diary app
          rm -rf app/test app/lib
          cp -r src/lib app/lib
          cp src/pubspec.yaml app/pubspec.yaml
      - name: Use fixed signing key (needed for Google Drive sign-in)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA-1" || true
      - name: Patch Gradle and Manifest
        run: |
          python3 - <<'PY'
          import re
          g='app/android/app/build.gradle'
          t=open(g).read()
          t=t.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
          t+="\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
          open(g,'w').write(t)
          m='app/android/app/src/main/AndroidManifest.xml'
          x=open(m).read()
          perms='''<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
          '''
          x=x.replace('<application',perms+'<application',1)
          rec='''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                </intent-filter>
              </receiver>
          '''
          x=x.replace('</application>',rec+'</application>',1)
          x=re.sub(r'android:label="[^"]*"','android:label="Advocate Diary"',x,1)
          open(m,'w').write(x)
          PY
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: advocate-diary-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
